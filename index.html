    <!-- Dark Mode -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");

          if (!t) {
            t = window.matchMedia(
              "(prefers-color-scheme: dark)"
            ).matches ? "dark" : "light";
          }

          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
